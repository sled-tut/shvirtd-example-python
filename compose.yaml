version: '3'

include:

  - proxy.yaml

services:

  db:

    image: mysql

    container_name: db

    restart: on-failure

    environment:

      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD}

      - MYSQL_PASSWORD=${MYSQL_PASSWORD}

      - MYSQL_DATABASE=${MYSQL_DATABASE}

      - MYSQL_USER=app

    env_file:

      - .env

    networks:

      backend:

        ipv4_address: 172.20.0.10

    volumes:

      - mysql_data:/var/lib/mysql

  web:

    build:

      context: .

      dockerfile: Dockerfile.python

    container_name: web

    networks:

      backend:

        ipv4_address: 172.20.0.5

    environment:

      - DB_HOST=db

      - DB_USER=app

      - DB_PASSWORD=${MYSQL_PASSWORD}

      - DB_NAME=${MYSQL_DATABASE}

    restart: on-failure

    depends_on:

      - db

networks:

  backend:

    driver: bridge

    ipam:

      config:

        - subnet: 172.20.0.0/16

volumes:

  mysql_data:
